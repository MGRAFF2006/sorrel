name: Build desktop artifacts

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string

jobs:
  build:
    name: Sorrel Hub desktop (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            apple_signing_identity: ""
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            apple_signing_identity: ""
          - runner: macos-latest
            target: aarch64-apple-darwin
            apple_signing_identity: "-"
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            apple_signing_identity: ""
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
            apple_signing_identity: ""
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            apple_signing_identity: "-"
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: sorrel-hub-desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: sorrel-hub-desktop/src-tauri
          key: desktop-${{ matrix.target }}
      - name: Install Tauri system dependencies
        if: ${{ startsWith(matrix.runner, 'ubuntu-') }}
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Install desktop dependencies
        run: npm ci
        working-directory: sorrel-hub-desktop
      - name: Build desktop installers
        uses: tauri-apps/tauri-action@v0.6.2
        env:
          APPLE_SIGNING_IDENTITY: ${{ matrix.apple_signing_identity }}
        with:
          projectPath: sorrel-hub-desktop
          args: --target ${{ matrix.target }}
      - name: Collect release bundles and checksums
        run: node scripts/collect-artifacts.mjs "src-tauri/target/${{ matrix.target }}/release/bundle" release-artifacts
        working-directory: sorrel-hub-desktop
      - name: Upload desktop artifacts
        uses: actions/upload-artifact@v7
        with:
          name: artifacts-desktop-${{ matrix.target }}
          path: sorrel-hub-desktop/release-artifacts/*
          if-no-files-found: error
