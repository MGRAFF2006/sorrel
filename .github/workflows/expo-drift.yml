name: Expo SDK drift

# Advisory: reports when installed Expo packages lag the latest patch releases
# of the pinned SDK. The required CI gate checks versions offline against the
# locked SDK instead. On failure, read the log first: install errors and other
# doctor checks fail this job too. For reported version drift, run
# `npx expo install --fix` in sorrel-hub-mobile and open a PR with the updated
# package.json and package-lock.json.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  doctor:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: sorrel-hub-mobile
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install locked mobile dependencies
        run: npm ci --no-audit --no-fund
      - name: Check Expo SDK dependency versions
        run: npm run doctor
