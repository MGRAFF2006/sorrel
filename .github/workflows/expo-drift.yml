name: Expo SDK drift

# Advisory: reports when installed Expo packages lag the latest patch releases
# of the pinned SDK. The required CI gate skips this network-dependent check.
# A failed run means: bump the reported packages with `npx expo install --fix`
# in sorrel-hub-mobile, regenerate its lockfile and open a PR.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  doctor:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: sorrel-hub-mobile
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install locked mobile dependencies
        run: npm ci --no-audit --no-fund
      - name: Check Expo SDK dependency versions
        run: npm run doctor
