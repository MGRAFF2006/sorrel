# Local / demo deploy of Sorrel web surfaces.
#
#   docker compose up --build
#
# Services:
#   hub      — collaboration API       http://localhost:3000
#   hub-web  — Hub UI (proxies /api)   http://localhost:5180
#   web      — landing preview only    http://localhost:4173
#
# Optional Convex metadata (profile `convex`):
#   docker compose --profile convex -f docker-compose.yml -f docker-compose.convex.yml up
#   convex-backend  http://localhost:3210
#   convex-dashboard http://localhost:6791
#
# Production landing is Cloudflare Pages (sorrel-web). The `web` service here
# is an optional local mirror and does not replace that deploy.
#
# This compose stack is an isolated developer preview. It explicitly enables
# the Hub's broad local bootstrap grants; never expose it as a production Hub.

services:
  hub:
    build: ./sorrel-hub
    ports:
      - "${SORREL_HUB_PORT:-3000}:3000"
    environment:
      HOST: "0.0.0.0"
      PORT: "3000"
      SORREL_HUB_BOOTSTRAP_GRANTS: "1"
      # Isolated compose demo only — never use this override on a public network.
      SORREL_HUB_ALLOW_INSECURE_DEV_AUTH: "1"
      SORREL_HUB_DATA_DIR: /app/data/sync
      SORREL_HUB_METADATA_DIR: /app/data/metadata
      SORREL_HUB_AUTH: "${SORREL_HUB_AUTH:-dev}"
      CONVEX_URL: "${CONVEX_URL:-}"
    volumes:
      - hub-data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10

  hub-web:
    build:
      context: .
      dockerfile: sorrel-hub-web/Dockerfile
    ports:
      - "${SORREL_HUB_WEB_PORT:-5180}:5180"
    environment:
      HOST: "0.0.0.0"
      PORT: "5180"
      HUB_API_URL: http://hub:3000
    depends_on:
      hub:
        condition: service_healthy

  web:
    build: ./sorrel-web
    ports:
      - "${SORREL_WEB_PORT:-4173}:80"

volumes:
  hub-data:
