[package]
name = "sorrel-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "sorrel"
path = "src/main.rs"

[dependencies]
clap = { version = "=4.5.4", features = ["derive"] }
fs2 = "0.4.3"
secretspec = { version = "0.18.0", default-features = false, features = ["keyring", "cli"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
serde_yaml_ng = "0.10.0"
sorrel-core = { path = "../sorrel-core" }
ureq = { version = "2.12.1", default-features = false, features = ["json"] }

[dev-dependencies]
sorrel-sdk = { path = "../sorrel-sdk-rust" }
assert_cmd = "=2.0.16"
tempfile = "3.27.0"

[lints]
workspace = true
