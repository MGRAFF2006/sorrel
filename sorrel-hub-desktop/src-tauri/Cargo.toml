[package]
name = "sorrel-hub-desktop"
version = "0.1.0-alpha.1"
description = "Native desktop host for Sorrel Hub"
authors = ["Mathis Graff"]
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/MGRAFF2006/sorrel"
rust-version = "1.85"

[lib]
name = "sorrel_hub_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-http = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"

[workspace]

[lints.rust]
unsafe_code = "forbid"
