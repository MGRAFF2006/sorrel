schemaVersion: sorrel.vault.v0
kind: SecretSpec
project:
  id: project_sorrel_vault
  name: sorrel-vault
  repo:
    type: repo
    ref: repo_sorrel_vault
  owners:
    - team:platform
environments:
  dev:
    name: dev
    classification: local
    requiresApproval: false
    policy:
      kind: Policy
      id: policy_vault_dev
    runnerAllowlist:
      - kind: Runner
        id: runner_local_process
    description: Developer workstation secrets loaded from local .env files.
secretRefs:
  - schemaVersion: sorrel.protocol.v0
    kind: SecretRef
    id: secret_npm_token_dev
    name: NPM_TOKEN
    provider: sorrel-vault
    uri: secret://project/sorrel-vault/dev/NPM_TOKEN
    environment: dev
    required: false
    valueType: token
    resource:
      kind: secret
      id: secret_npm_token_dev
    redaction:
      schemaVersion: sorrel.protocol.v0
      kind: RedactionMarker
      id: redaction_secret_npm_token_dev
      resource:
        kind: secret
        id: secret_npm_token_dev
      marker: <sorrel:redacted secret_npm_token_dev>
      reason: Secret value is redacted from Sorrel objects.
    scopes:
      - type: workflow
        ref: workflow_validate_vault
      - type: runner
        ref: runner_local_process
      - type: environment
        ref: dev
    version: local
    rotation:
      cadence: manual
    description: Local package token handle used by validation examples only.
  - schemaVersion: sorrel.protocol.v0
    kind: SecretRef
    id: secret_database_url_dev
    name: DATABASE_URL
    provider: sorrel-vault
    uri: secret://project/sorrel-vault/dev/DATABASE_URL
    environment: dev
    required: true
    valueType: url
    resource:
      kind: secret
      id: secret_database_url_dev
    redaction:
      schemaVersion: sorrel.protocol.v0
      kind: RedactionMarker
      id: redaction_secret_database_url_dev
      resource:
        kind: secret
        id: secret_database_url_dev
      marker: <sorrel:redacted secret_database_url_dev>
      reason: Secret value is redacted from Sorrel objects.
    scopes:
      - type: workflow
        ref: workflow_validate_vault
      - type: runner
        ref: runner_local_process
      - type: environment
        ref: dev
    version: local
    rotation:
      cadence: manual
    description: Local database URL handle imported from a developer .env file.
grants:
  - id: grant_dev_validation_runner
    secret:
      kind: SecretRef
      id: secret_npm_token_dev
    environment: dev
    actions:
      - read
      - materialize
      - redact
    access:
      agents:
        - kind: AgentPolicy
          id: agent_policy_local_dev
      workflows:
        - kind: Workflow
          id: workflow_validate_vault
      runners:
        - kind: Runner
          id: runner_local_process
    policy:
      kind: Policy
      id: policy_vault_dev
    reason: Local validation can read the fake NPM token fixture.
  - id: grant_dev_database_runner
    secret:
      kind: SecretRef
      id: secret_database_url_dev
    environment: dev
    actions:
      - read
      - materialize
      - redact
    access:
      agents:
        - kind: AgentPolicy
          id: agent_policy_local_dev
      workflows:
        - kind: Workflow
          id: workflow_validate_vault
      runners:
        - kind: Runner
          id: runner_local_process
    policy:
      kind: Policy
      id: policy_vault_dev
    reason: Local validation can read the fake database fixture.
localDev:
  backend: local-dev
  import:
    envFiles:
      - path: examples/.env.dev.example
        environment: dev
        required: true
    defaultKeyStrategy: secretRefName
    allowProcessEnvFallback: false
  storage:
    namespace: local://sorrel-vault/dev
    persist: false
    materialize: environment
  bindings:
    - secret:
        kind: SecretRef
        id: secret_npm_token_dev
      environment: dev
      envKey: NPM_TOKEN
      storeKey: project/sorrel-vault/dev/NPM_TOKEN
    - secret:
        kind: SecretRef
        id: secret_database_url_dev
      environment: dev
      envKey: DATABASE_URL
      storeKey: project/sorrel-vault/dev/DATABASE_URL
redaction:
  mask: "***"
  minSecretLength: 6
  visiblePrefix: 2
  visibleSuffix: 2
  detectEnvKeys:
    - TOKEN
    - SECRET
    - PASSWORD
    - DATABASE_URL
metadata:
  protocolRefs: SecretRef,Policy,Runner,Workflow,AgentPolicy
