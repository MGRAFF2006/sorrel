schemaVersion: sorrel.vault.v0
kind: SecretSpec
project:
  id: project_sorrel_vault
  name: sorrel-vault
  repo:
    type: repo
    ref: repo_sorrel_vault
  owners:
    - team:platform
environments:
  prod:
    name: prod
    classification: protected
    requiresApproval: true
    policy:
      kind: Policy
      id: policy_vault_prod
    runnerAllowlist:
      - kind: Runner
        id: runner_prod_ephemeral
    description: Production handles are declared for planning; no cloud provider integration is implemented yet.
secretRefs:
  - schemaVersion: sorrel.protocol.v0
    kind: SecretRef
    id: secret_release_signing_key_prod
    name: RELEASE_SIGNING_KEY
    provider: sorrel-vault
    uri: secret://project/sorrel-vault/prod/RELEASE_SIGNING_KEY
    environment: prod
    required: true
    valueType: key
    scopes:
      - type: workflow
        ref: workflow_production_release
      - type: runner
        ref: runner_prod_ephemeral
      - type: environment
        ref: prod
    version: current
    rotation:
      cadence: quarterly
    description: Production release signing key handle; raw key material is never committed.
  - schemaVersion: sorrel.protocol.v0
    kind: SecretRef
    id: secret_error_reporting_dsn_prod
    name: ERROR_REPORTING_DSN
    provider: sorrel-vault
    uri: secret://project/sorrel-vault/prod/ERROR_REPORTING_DSN
    environment: prod
    required: true
    valueType: url
    scopes:
      - type: workflow
        ref: workflow_production_release
      - type: runner
        ref: runner_prod_ephemeral
      - type: environment
        ref: prod
    version: current
    rotation:
      cadence: manual
    description: Production error-reporting endpoint handle.
grants:
  - id: grant_prod_release_signing_read
    secret:
      kind: SecretRef
      id: secret_release_signing_key_prod
    environment: prod
    actions:
      - read
      - redact
    access:
      agents:
        - kind: AgentPolicy
          id: agent_policy_production_release
      workflows:
        - kind: Workflow
          id: workflow_production_release
      runners:
        - kind: Runner
          id: runner_prod_ephemeral
    policy:
      kind: Policy
      id: policy_vault_prod
    reason: Production release automation may request the handle after approval; materialization is deferred.
  - id: grant_prod_error_reporting_read
    secret:
      kind: SecretRef
      id: secret_error_reporting_dsn_prod
    environment: prod
    actions:
      - read
      - redact
    access:
      agents:
        - kind: AgentPolicy
          id: agent_policy_production_release
      workflows:
        - kind: Workflow
          id: workflow_production_release
      runners:
        - kind: Runner
          id: runner_prod_ephemeral
    policy:
      kind: Policy
      id: policy_vault_prod
    reason: Production release automation may request the DSN handle after approval.
localDev:
  backend: local-dev
  import:
    envFiles:
      - path: examples/.env.prod.example
        environment: prod
        required: false
    defaultKeyStrategy: secretRefName
    allowProcessEnvFallback: false
  storage:
    namespace: local://sorrel-vault/prod
    persist: false
    materialize: none
  bindings:
    - secret:
        kind: SecretRef
        id: secret_release_signing_key_prod
      environment: prod
      envKey: RELEASE_SIGNING_KEY
      storeKey: project/sorrel-vault/prod/RELEASE_SIGNING_KEY
    - secret:
        kind: SecretRef
        id: secret_error_reporting_dsn_prod
      environment: prod
      envKey: ERROR_REPORTING_DSN
      storeKey: project/sorrel-vault/prod/ERROR_REPORTING_DSN
redaction:
  mask: "***"
  minSecretLength: 8
  visiblePrefix: 0
  visibleSuffix: 4
  detectEnvKeys:
    - KEY
    - TOKEN
    - SECRET
    - PASSWORD
    - DSN
metadata:
  protocolRefs: SecretRef,Policy,Runner,Workflow,AgentPolicy
