schemaVersion: sorrel.vault.v0
kind: SecretSpec
project:
  id: project_sorrel_vault
  name: sorrel-vault
  repo:
    type: repo
    ref: repo_sorrel_vault
  owners:
    - team:platform
environments:
  staging:
    name: staging
    classification: shared
    requiresApproval: true
    policy:
      kind: Policy
      id: policy_vault_staging
    runnerAllowlist:
      - kind: Runner
        id: runner_staging_container
    description: Shared pre-production environment; values are still represented as Sorrel handles.
secretRefs:
  - schemaVersion: sorrel.protocol.v0
    kind: SecretRef
    id: secret_npm_token_staging
    name: NPM_TOKEN
    provider: sorrel-vault
    uri: secret://project/sorrel-vault/staging/NPM_TOKEN
    environment: staging
    required: true
    valueType: token
    scopes:
      - type: workflow
        ref: workflow_release_candidate
      - type: runner
        ref: runner_staging_container
      - type: environment
        ref: staging
    version: current
    rotation:
      cadence: quarterly
    description: Staging package token handle; no raw token value is stored.
  - schemaVersion: sorrel.protocol.v0
    kind: SecretRef
    id: secret_api_base_url_staging
    name: API_BASE_URL
    provider: sorrel-vault
    uri: secret://project/sorrel-vault/staging/API_BASE_URL
    environment: staging
    required: true
    valueType: url
    scopes:
      - type: workflow
        ref: workflow_release_candidate
      - type: runner
        ref: runner_staging_container
      - type: environment
        ref: staging
    version: current
    rotation:
      cadence: manual
    description: Staging API endpoint handle.
grants:
  - id: grant_staging_release
    secret:
      kind: SecretRef
      id: secret_npm_token_staging
    environment: staging
    actions:
      - read
      - materialize
      - redact
    access:
      agents:
        - kind: AgentPolicy
          id: agent_policy_release
      workflows:
        - kind: Workflow
          id: workflow_release_candidate
      runners:
        - kind: Runner
          id: runner_staging_container
    policy:
      kind: Policy
      id: policy_vault_staging
    reason: Release automation can materialize staging package credentials.
  - id: grant_staging_api_url
    secret:
      kind: SecretRef
      id: secret_api_base_url_staging
    environment: staging
    actions:
      - read
      - materialize
      - redact
    access:
      agents:
        - kind: AgentPolicy
          id: agent_policy_release
      workflows:
        - kind: Workflow
          id: workflow_release_candidate
      runners:
        - kind: Runner
          id: runner_staging_container
    policy:
      kind: Policy
      id: policy_vault_staging
    reason: Release automation can read the staging API URL handle.
localDev:
  backend: local-dev
  import:
    envFiles:
      - path: examples/.env.staging.example
        environment: staging
        required: false
    defaultKeyStrategy: secretRefName
    allowProcessEnvFallback: false
  storage:
    namespace: local://sorrel-vault/staging
    persist: false
    materialize: environment
  bindings:
    - secret:
        kind: SecretRef
        id: secret_npm_token_staging
      environment: staging
      envKey: NPM_TOKEN
      storeKey: project/sorrel-vault/staging/NPM_TOKEN
    - secret:
        kind: SecretRef
        id: secret_api_base_url_staging
      environment: staging
      envKey: API_BASE_URL
      storeKey: project/sorrel-vault/staging/API_BASE_URL
redaction:
  mask: "***"
  minSecretLength: 6
  visiblePrefix: 2
  visibleSuffix: 2
  detectEnvKeys:
    - TOKEN
    - SECRET
    - PASSWORD
    - API_BASE_URL
metadata:
  protocolRefs: SecretRef,Policy,Runner,Workflow,AgentPolicy
